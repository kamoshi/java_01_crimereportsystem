

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Responder</title>
</head>
<body>
<h1>Create Responder</h1>

<form th:action="@{/responders}" th:object="${responder}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" required>
    <br><br>

    <label>Phone Number:</label>
    <input type="text" th:field="*{phoneNumber}">
    <br><br>

    <label>Address:</label>
    <input type="text" th:field="*{address}">
    <br><br>

    <label>Login:</label>
    <input type="text" th:field="*{login}" required>
    <br><br>

    <label>Password:</label>
    <input type="password" th:field="*{password}" required>
    <br><br>

    <label>Station ID:</label>
    <input type="number" th:field="*{station}">
    <br><br>

    <label>Current Place:</label>
    <input type="text" th:field="*{currentPlace}">
    <br><br>

    <label>Current Job ID:</label>
    <input type="number" th:field="*{currentJob}">
    <br><br>

    <button type="submit">Save Responder</button>
</form>

<a th:href="@{/responders}">Back</a>
</body>
</html>
