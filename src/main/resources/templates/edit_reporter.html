<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Reporter</title>
</head>
<body>
<h1>Edit Reporter</h1>

<form th:action="@{/reporters/edit/{id}(id=${reporter.id})}"
      th:object="${reporter}" method="post">

    <label>Name:</label>
    <input type="text" th:field="*{name}">
    <br><br>

    <label>Phone:</label>
    <input type="text" th:field="*{phoneNumber}">
    <br><br>

    <label>Address:</label>
    <input type="text" th:field="*{address}">
    <br><br>

    <label>Login:</label>
    <input type="text" th:field="*{login}">
    <br><br>

    <button type="submit">Update Reporter</button>
</form>

<a th:href="@{/reporters}">Back</a>
</body>
</html>
