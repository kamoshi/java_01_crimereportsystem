<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Station</title>
</head>
<body>
<h1>Edit Police Station</h1>

<form th:action="@{/stations/edit/{id}(id=${station.id})}"
      th:object="${station}" method="post">

    <label>Address:</label>
    <input type="text" th:field="*{address}" required>
    <br><br>

    <label>Phone Number:</label>
    <input type="text" th:field="*{phoneNumber}" required>
    <br><br>

    <button type="submit">Update Station</button>
</form>

<a th:href="@{/stations}">Back</a>
</body>
</html>
